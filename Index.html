    body {
        background-color: #0A0A0A;
        font-family: 'Satoshi', sans-serif;

        display: flex;
        justify-content: center;
        place-items: center;
        flex-direction: column;
        margin: 0;
        padding: 0;
    }

    html {
        height: 100%;
    }

    body {
        min-height: 100%;
    }

    .logo {
        text-align: center;
        color: #fafafa;
        display: flex;
        flex-direction: column;
        place-items: center;
    }

    .logo h1 span {
        color: #b472e0;
    }

    .logo h1 {
        font-size: 47px;
        margin: 0;
        margin-top: 25px;
    }

    .logo img {
        height: 160px;
    }

    .loader {
        display: flex;
    }

    .loader svg {
        font-size: 65px;
        color: #ffffff;
    }

    .container {
        text-align: center;
        color: #fafafa;
        padding-left: 15px;
        padding-right: 15px;
        display: flex;
        flex-direction: column;
        place-items: center;
        z-index: 9999;
    }

    .container h3 {
        font-weight: 550;
        margin: 0;
        color: #ae8cc5;
        margin-bottom: 15px;
    }

    .wrapper {
        animation: 1.75s loading infinite;
        max-width: fit-content;
    }

    @keyframes loading {

        0%,
        100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.18);
        }
    }

    .footer {
        height: 30px;
        position: absolute;
        bottom: 19px;
        width: 55%;
        padding-top: 18px;
        color: #cccccc;
        display: flex;
        justify-content: space-between;
        place-items: center;
    }

    .footerWrapper {
        display: flex;
        justify-content: center;
        width: 100%;
    }

    .footer h1,
    h3 {
        margin: 0;
    }

    .left h3 {
        font-size: 15px;
    }

    .discord {
        color: #5662F6;
    }

    .right {
        display: flex;
        gap: 7px;
    }

    .iconify {
        font-size: 25px;
    }

    .right a {
        display: flex;
        place-items: center;
        text-decoration: none;
        color: #fafafa;
    }

    .right a svg {
        margin-left: 7px;
        transition: 0.35s;
    }

    .right a svg:hover {
        transform: scale(1.2);
    }

    .line {
        position: absolute;
        bottom: 65px;
        height: 1.7px;
        width: 60%;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.001), #ba52ff2d, rgba(255, 255, 255, 0.001));
    }

    @media (max-width: 1500px) {
        .line {
            width: 80%;
        }

        .footer {
            width: 72%;
        }
    }

    @media (max-width: 870px) {
        .line {
            width: 90%;
        }

        .footer {
            width: 82%;
        }
    }

    @media (max-width: 630px) {
        .line {
            width: 100%;
        }

        .footer {
            width: 92%;
        }

        .left h3 {
            font-size: 14px;
        }

        .right a span {
            font-size: 14.7px;
        }
    }

    @media (max-width: 450px) {
        .right a span {
            display: none;
        }

        .right a svg {
            font-size: 29.5px;
        }
    }

    .bg {
        position: absolute;
        height: 100%;
        width: 100%;
        object-fit: cover;
        z-index: 999;
    }

        background-color: #0a0a0a15;
        z-index: 9999;
        position: absolute;
        height: 100%;
        width: 100%;
